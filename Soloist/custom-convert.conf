#
# Soloist Connect capture (soloist:connect)
#
# $FILE$ is the capture device from the Soloist settings page. The plugin
# replaces the --buffer-time/--period-time values with the "Capture buffer"
# setting, so change that setting rather than editing the numbers here.
# Capture is 24-bit (S24_3LE); plughw converts from whatever format Soloist
# plays into the Loopback, so 16-bit sources are padded losslessly.
#
sol flc * *
	# R
	[arecord] -d0 -c2 -f S24_3LE -r 44100 -t raw --buffer-time=2000000 --period-time=50000 -D $FILE$ | [flac] -cs --totally-silent --compression-level-0 --force-raw-format --endian=little --sign=signed --channels=2 --bps=24 --sample-rate=44100 -
sol pcm * *
	# R
	[arecord] -d0 -c2 -f S16_LE -r 44100 -t raw --buffer-time=2000000 --period-time=50000 -D $FILE$
